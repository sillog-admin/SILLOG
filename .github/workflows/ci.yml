name: CI

on:
  pull_request:
    paths-ignore: ['landing/**', '.github/workflows/landing.yml']
  push:
    branches: [main]
    paths-ignore: ['landing/**', '.github/workflows/landing.yml']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main runs publish a release, so never cancel them midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Match the team toolchain (Swift 6.2); Xcode 16 cannot type-check some views.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # main releases are signed with one fixed self-signed certificate so updates keep keychain access and macOS permissions.
      - name: Import signing certificate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.SILLOG_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.SILLOG_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"

      - name: Build app bundle
        env:
          SIGN_IDENTITY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'SILLOG Release' || '-' }}
          SILLOG_GOOGLE_CLIENT_SECRET: ${{ secrets.SILLOG_GOOGLE_CLIENT_SECRET }}
        run: ./scripts/make-app.sh

      # On main, publish the dmg as this repo's latest release; the landing links to releases/latest/download/SILLOG.dmg.
      - name: Package dmg
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage" && mkdir -p "$stage"
          ditto "$HOME/Applications/SILLOG.app" "$stage/SILLOG.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname SILLOG -srcfolder "$stage" -ov -format UDZO "$RUNNER_TEMP/SILLOG.dmg"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw "$HOME/Applications/SILLOG.app/Contents/Info.plist")"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP/SILLOG.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SILLOG ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "main ${GITHUB_SHA::7} 에서 빌드" \
            --latest
