name: CI

on:
  pull_request:
    paths-ignore: ['landing/**', '.github/workflows/landing.yml']
  push:
    branches: [main]
    paths-ignore: ['landing/**', '.github/workflows/landing.yml']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main runs publish a release, so never cancel them midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Match the team toolchain (Swift 6.2); Xcode 16 cannot type-check some views.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # main releases are signed with Developer ID so they can be notarized; PR builds stay ad-hoc.
      - name: Import signing certificate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.SILLOG_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.SILLOG_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          # The runner lacks Apple's Developer ID intermediate, so codesign can't build the chain without it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true   # the p12 may already carry it
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"

      - name: Build app bundle
        env:
          SIGN_IDENTITY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'Developer ID Application' || '-' }}
          SILLOG_GOOGLE_CLIENT_SECRET: ${{ secrets.SILLOG_GOOGLE_CLIENT_SECRET }}
          SILLOG_GOOGLE_API_KEY: ${{ secrets.SILLOG_GOOGLE_API_KEY }}
          SILLOG_BUILD_DIR: ${{ runner.temp }}/sillog-build
        run: ./scripts/make-app.sh

      # With the build folder gone, as on a user's Mac, a resource only this runner can see fails here instead of in the release.
      - name: Smoke test app bundle
        run: |
          mv "$RUNNER_TEMP/sillog-build" "$RUNNER_TEMP/sillog-build-hidden"
          for lang in ko en; do
            SILLOG_SNAPSHOT="$RUNNER_TEMP/snapshots-$lang" SILLOG_LANG="$lang" "$HOME/Applications/SILLOG.app/Contents/MacOS/Sillog"
          done

      # On main, publish the dmg as this repo's latest release; the landing links to releases/latest/download/SILLOG.dmg.
      - name: Package dmg
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage" && mkdir -p "$stage"
          ditto "$HOME/Applications/SILLOG.app" "$stage/SILLOG.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname SILLOG -srcfolder "$stage" -ov -format UDZO "$RUNNER_TEMP/SILLOG.dmg"
          codesign --sign "Developer ID Application" --timestamp "$RUNNER_TEMP/SILLOG.dmg"

      # Notarizing the dmg also registers the app inside, so Gatekeeper accepts it after it's copied out.
      - name: Notarize dmg
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NOTARY_KEY: ${{ secrets.SILLOG_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.SILLOG_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.SILLOG_NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key"
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          out="$(xcrun notarytool submit "$RUNNER_TEMP/SILLOG.dmg" "${auth[@]}" --wait --timeout 60m --output-format json)"
          echo "$out"
          if [ "$(plutil -extract status raw - <<< "$out")" != "Accepted" ]; then
            xcrun notarytool log "$(plutil -extract id raw - <<< "$out")" "${auth[@]}"
            exit 1
          fi
          rm "$key"
          xcrun stapler staple "$RUNNER_TEMP/SILLOG.dmg"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw "$HOME/Applications/SILLOG.app/Contents/Info.plist")"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP/SILLOG.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SILLOG ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "main ${GITHUB_SHA::7} 에서 빌드" \
            --latest
