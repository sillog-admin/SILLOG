name: CI

on:
  # Root *.md only: the .md files under Sources are prompts that ship in the app.
  pull_request:
    paths-ignore: ['landing/**', '.github/workflows/landing.yml', '.github/workflows/sync-sumunjang.yml', '*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['landing/**', '.github/workflows/landing.yml', '.github/workflows/sync-sumunjang.yml', '*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main runs publish a release, so never cancel them midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # A PR runs its two halves on two runners at once (about 8 minutes instead of 15): build and test,
    # and the release-style app bundle with its smoke test. main only builds the app and releases, since its PRs passed the tests.
    # shortcut: main no longer saves the .build cache, so after a Package.resolved change each PR warms its own once.
    name: ${{ matrix.part == 'test' && 'Build and test' || github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'Build and release' || 'App bundle' }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '["app"]' || '["test", "app"]') }}
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Keep the write token out of .git/config, where PR code under test could read it.
          persist-credentials: false

      # Match the team toolchain (Swift 6.2); Xcode 16 cannot type-check some views.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          swift --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.part != 'app'
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        if: matrix.part != 'app'
        run: swift build --build-tests

      - name: Test
        if: matrix.part != 'app'
        run: swift test --skip-build

      # main releases are signed with Developer ID so they can be notarized; PR builds stay ad-hoc.
      - name: Import signing certificate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.SILLOG_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.SILLOG_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          # The runner lacks Apple's Developer ID intermediate, so codesign can't build the chain without it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true   # the p12 may already carry it
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"

      # The release build has its own folder, so without this it recompiles every dependency on each run.
      - name: Restore app build cache
        if: matrix.part != 'test'
        id: app-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sillog-build
          key: app-build-${{ runner.os }}-${{ hashFiles('Package.resolved', 'scripts/make-app.sh') }}
          restore-keys: app-build-${{ runner.os }}-

      - name: Build app bundle
        if: matrix.part != 'test'
        env:
          SIGN_IDENTITY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'Developer ID Application' || '-' }}
          SILLOG_GOOGLE_CLIENT_SECRET: ${{ secrets.SILLOG_GOOGLE_CLIENT_SECRET }}
          SILLOG_GOOGLE_API_KEY: ${{ secrets.SILLOG_GOOGLE_API_KEY }}
          SILLOG_BUILD_DIR: ${{ runner.temp }}/sillog-build
        run: ./scripts/make-app.sh

      # Saved here because the smoke test moves the folder away; the built app was already moved out, so no secrets.
      - name: Save app build cache
        if: matrix.part != 'test' && steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/sillog-build
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

      # With the build folder gone, as on a user's Mac, a resource only this runner can see fails here instead of in the release.
      - name: Smoke test app bundle
        if: matrix.part != 'test'
        run: |
          mv "$RUNNER_TEMP/sillog-build" "$RUNNER_TEMP/sillog-build-hidden"
          for lang in ko en; do
            SILLOG_SNAPSHOT="$RUNNER_TEMP/snapshots-$lang" SILLOG_LANG="$lang" "$HOME/Applications/SILLOG.app/Contents/MacOS/Sillog"
          done

      # On main, publish the dmg as this repo's latest release; the landing links to releases/latest/download/SILLOG.dmg.
      - name: Package dmg
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          ./scripts/make-dmg.sh "$HOME/Applications/SILLOG.app" "$RUNNER_TEMP/SILLOG.dmg"
          codesign --sign "Developer ID Application" --timestamp "$RUNNER_TEMP/SILLOG.dmg"

      # Notarizing the dmg also registers the app inside, so Gatekeeper accepts it after it's copied out.
      - name: Notarize dmg
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NOTARY_KEY: ${{ secrets.SILLOG_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.SILLOG_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.SILLOG_NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key"
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          out="$(xcrun notarytool submit "$RUNNER_TEMP/SILLOG.dmg" "${auth[@]}" --wait --timeout 60m --output-format json)"
          echo "$out"
          if [ "$(plutil -extract status raw - <<< "$out")" != "Accepted" ]; then
            xcrun notarytool log "$(plutil -extract id raw - <<< "$out")" "${auth[@]}"
            exit 1
          fi
          rm "$key"
          xcrun stapler staple "$RUNNER_TEMP/SILLOG.dmg"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw "$HOME/Applications/SILLOG.app/Contents/Info.plist")"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP/SILLOG.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SILLOG ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "main ${GITHUB_SHA::7} 에서 빌드" \
            --latest \
            || gh release upload "$tag" "$RUNNER_TEMP/SILLOG.dmg" --repo "$GITHUB_REPOSITORY" --clobber   # a re-run rebuilt the dmg, so replace it to match the cask sha256

      # brew install --cask sillog-admin/tap/sillog reads the version and sha256 from this cask.
      - name: Update Homebrew cask
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw "$HOME/Applications/SILLOG.app/Contents/Info.plist"),${GITHUB_RUN_NUMBER}"
          sha="$(shasum -a 256 "$RUNNER_TEMP/SILLOG.dmg" | cut -d ' ' -f 1)"
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:sillog-admin/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s/^  version \".*\"/  version \"${version}\"/; s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/sillog.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "sillog ${version}"
          git push
          rm "$key"
